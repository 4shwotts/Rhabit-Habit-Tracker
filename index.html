<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habit Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Alumni+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- shared SVG filters: warp "hologram" border lines so they're never
         perfectly straight. The feComponentTransfer step re-sharpens the
         warped line so it stays crisp instead of smeared. *-fill variants use
         the same noise without sharpening, so a fill bends exactly with its
         border. Used via filter: url(#...) in App.css -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <filter id="holo-distort" x="-6%" y="-40%" width="112%" height="180%">
        <feTurbulence type="fractalNoise" baseFrequency="0.02 0.55" numOctaves="2" seed="4" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" />
        <feComponentTransfer><feFuncA type="table" tableValues="0 0 1 1" /></feComponentTransfer>
      </filter>
      <!-- same warp without the alpha sharpening, for translucent fills -->
      <filter id="holo-distort-fill" x="-6%" y="-40%" width="112%" height="180%">
        <feTurbulence type="fractalNoise" baseFrequency="0.02 0.55" numOctaves="2" seed="4" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <!-- gentler versions: task cards, then Start / Log out -->
      <filter id="holo-distort-soft" x="-4%" y="-30%" width="108%" height="160%">
        <feTurbulence type="fractalNoise" baseFrequency="0.015 0.45" numOctaves="1" seed="9" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" />
        <feComponentTransfer><feFuncA type="table" tableValues="0 0 1 1" /></feComponentTransfer>
      </filter>
      <filter id="holo-distort-soft-fill" x="-4%" y="-30%" width="108%" height="160%">
        <feTurbulence type="fractalNoise" baseFrequency="0.015 0.45" numOctaves="1" seed="9" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="holo-distort-faint" x="-4%" y="-30%" width="108%" height="160%">
        <feTurbulence type="fractalNoise" baseFrequency="0.02 0.5" numOctaves="1" seed="2" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
