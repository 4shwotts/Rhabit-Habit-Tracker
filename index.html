<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habit Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Alumni+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Silkscreen:wght@400;700&family=Tektur:wght@400&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- shared SVG filters: holo-distort-fill warps the hint panel and the task
         cards (fill and edge bend together). Used via filter: url(#...) in App.css -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <filter id="holo-distort-fill" x="-6%" y="-40%" width="112%" height="180%">
        <feTurbulence type="fractalNoise" baseFrequency="0.02 0.55" numOctaves="2" seed="4" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="9" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <!-- subtle warp for distorted text (setup warning) -->
      <filter id="text-distort" x="-2%" y="-20%" width="104%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.01 0.35" numOctaves="1" seed="6" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
