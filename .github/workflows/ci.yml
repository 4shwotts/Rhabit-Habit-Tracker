# Runs on every push and pull request: install, lint, unit and API tests with
# coverage, build, then the end-to-end tests in Chromium.
#
# Everything runs against the throwaway Postgres service below, never Neon or
# the live site. Secrets are optional: each one only replaces a test-only value,
# so forks and first runs still pass without any set up.
name: CI

on:
  push:
    # the badges branch only holds the coverage badge's numbers
    branches-ignore: [badges]
  pull_request:

permissions:
  contents: read

# a newer push to the same branch replaces a run still in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: rhabit
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD || 'test-only-password' }}
          POSTGRES_DB: rhabit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rhabit -d rhabit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://rhabit:${{ secrets.TEST_DB_PASSWORD || 'test-only-password' }}@localhost:5432/rhabit_test
      # left blank when unset, and the test setup then uses its own test-only values
      JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
      TOTP_ENCRYPTION_KEY: ${{ secrets.TEST_TOTP_KEY }}
      E2E_JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
      E2E_TOTP_KEY: ${{ secrets.TEST_TOTP_KEY }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server

      - name: Lint
        run: npm run lint

      - name: Unit and API tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage/
            server/coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      # failure traces and screenshots, plus the accessibility results
      - name: Upload Playwright results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Keeps the README's coverage badge true. It runs apart from the job above
  # because it's the only part allowed to write to the repository, and it only
  # touches the badges branch, which is replaced each time.
  coverage-badge:
    name: Update the coverage badge
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: coverage

      - name: Work out the badge
        run: node scripts/coverage-badge.mjs server/coverage/coverage-summary.json "$RUNNER_TEMP/coverage.json"

      - name: Publish it to the badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan badges
          git rm -rf --quiet .
          git clean -fdxq
          cp "$RUNNER_TEMP/coverage.json" coverage.json
          git add coverage.json
          git commit -m "Update coverage badge"
          git push --force origin badges
